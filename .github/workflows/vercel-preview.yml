name: Vercel Preview Environment Variables Test

on:
  pull_request:
    branches: [ main ]

jobs:
  test-env-vars:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Test environment variable loading
      run: |
        # Create a test script to validate environment variable patterns
        cat > test-env-vars.js << 'EOF'
        const fs = require('fs');
        const path = require('path');

        console.log('🔍 Testing environment variable configuration...');

        // Check if any NEXT_PUBLIC_ prefixed sensitive variables exist in code
        const sensitivePatterns = [
          'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY',
          'NEXT_PUBLIC_SCHEDULE_API_KEY', 
          'NEXT_PUBLIC_AMADEUS_API_KEY',
          'NEXT_PUBLIC_AMADEUS_API_SECRET'
        ];

        let hasSecurityIssues = false;

        function checkFile(filePath) {
          if (!fs.existsSync(filePath)) return;
          
          const content = fs.readFileSync(filePath, 'utf8');
          
          sensitivePatterns.forEach(pattern => {
            if (content.includes(pattern)) {
              console.error(`❌ SECURITY ISSUE: Found ${pattern} in ${filePath}`);
              console.error('   This exposes API keys to the client side!');
              hasSecurityIssues = true;
            }
          });
        }

        // Check key files
        const filesToCheck = [
          'src/lib/apiService.ts',
          'src/lib/pricingService.ts', 
          'src/app/api/maps-proxy/route.ts',
          'PRICING_INTEGRATION.md',
          '.env.example'
        ];

        filesToCheck.forEach(checkFile);

        // Check for proper server-side patterns
        const serverSidePatterns = [
          'process.env.GOOGLE_MAPS_API_KEY',
          'process.env.SCHEDULE_API_KEY',
          'process.env.AMADEUS_API_KEY'
        ];

        let hasServerSideConfig = false;

        filesToCheck.forEach(file => {
          if (!fs.existsSync(file)) return;
          
          const content = fs.readFileSync(file, 'utf8');
          serverSidePatterns.forEach(pattern => {
            if (content.includes(pattern)) {
              console.log(`✅ Found proper server-side variable: ${pattern} in ${file}`);
              hasServerSideConfig = true;
            }
          });
        });

        if (hasSecurityIssues) {
          console.error('❌ Security issues found! API keys are exposed client-side.');
          process.exit(1);
        }

        if (!hasServerSideConfig) {
          console.warn('⚠️  No server-side environment variables detected.');
        }

        console.log('✅ Environment variable security check passed!');
        EOF

        node test-env-vars.js
        
    - name: Test build with minimal environment variables
      run: |
        # Test that build works with minimal required env vars
        export GOOGLE_MAPS_API_KEY="test-key"
        export SCHEDULE_API_KEY="test-key"
        npm run build
        
    - name: Validate build output
      run: |
        # Check that no sensitive data leaked into build output
        echo "🔍 Checking build output for sensitive data..."
        
        if grep -r "NEXT_PUBLIC_.*API_KEY" .next/ 2>/dev/null; then
          echo "❌ Found potentially exposed API keys in build output!"
          exit 1
        fi
        
        echo "✅ Build output security check passed!"
        
    - name: Comment on PR with environment variable status
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const success = '${{ job.status }}' === 'success';
          const body = success 
            ? '🔒 **Environment Variable Security Check Passed**\n\n✅ No API keys exposed client-side\n✅ Build works with test environment variables\n✅ No sensitive data in build output\n\nYour changes are ready for Vercel preview deployment!'
            : '⚠️ **Environment Variable Issues Detected**\n\nPlease check the workflow logs for details. Common issues:\n- API keys exposed with NEXT_PUBLIC_ prefix\n- Missing required environment variables\n- Sensitive data in build output';
            
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          })